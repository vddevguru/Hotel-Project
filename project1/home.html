<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <header style="background-color:#e61e43;height:40px; color: white;">
         <table>
            <tr>
                <td><img src="./logo.webp" alt="logo" width="30px"height="30px"></td>

    <section>

        <br><br>
        <table style="margin: 0 auto;">
            <tr>
                <td style="padding: 20px;"><img src="./signup.jpg" alt="signup" height="80px">

                    <input type="email" id="email" name="email" placeholder="Email" style="width:300px; height:20px;" required>

                    <br><br>

                    <input type="date" id="1">

                    <p style="color: #e61e43;font-weight: bold; display: inline;">Gender:</p>
                    <label for="female"style="font-weight:bold;">
                    <input type="radio" id="female" value="Female" name="gender">Female</label>
                    <label for="male"style="font-weight:bold;">
                    <input type="radio" id="male" value="male" name="gender">Male</label>
                    <label for="other"style="font-weight:bold;">
                    <input type="radio" id="other" value="other" name="gender">Other</label>
                    <br><br>
                    <input type="submit" value="Register" style="width:300px; height:30px;background-color: #e61e43;border:none; border-radius:5px; color: white;  font-weight: bold;">
                 </form>
                </td>
